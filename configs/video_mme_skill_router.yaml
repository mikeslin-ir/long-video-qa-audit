planner: rule_based
cache_dir: results/skill_router_cache
# Long videos (up to ~1h); take fewer candidates per second.
candidate_stride: 15
max_candidates: 4096
normalization: minmax
lambda_uniform: 0.0
use_stub_skills: false
semantic_clip_model: openai/clip-vit-base-patch32
semantic_siglip_model: google/siglip-base-patch16-224
object_siglip_model: google/siglip-base-patch16-224
asr_whisper_model: openai/whisper-tiny.en
ocr_backend: auto
ocr_conf_threshold: 0.35
